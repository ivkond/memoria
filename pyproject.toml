[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "memoria"
version = "0.1.0"
description = "The missing self-hosted memory backend for MCP clients."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastmcp>=2.14.0",
  "mem0ai>=1.0.7",
  "langchain-memgraph>=0.1.12",
  "rank-bm25>=0.2.2",
  "pydantic-settings>=2.0.0",
  "qdrant-client>=1.17.0",
  "httpx>=0.27.0",
  "PyJWT[crypto]>=2.10.1",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.20.1",
  "pytest>=9.0.0",
  "pytest-asyncio>=1.0.0",
  "pytest-cov>=7.0.0",
  "ruff>=0.13.0",
  "testcontainers>=4.14.0",
]

[project.scripts]
memoria = "memoria.__main__:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "e2e: end-to-end integration tests that require Docker/Testcontainers",
]

[tool.mypy]
python_version = "3.12"
packages = ["memoria"]
mypy_path = "src"
ignore_missing_imports = true
namespace_packages = true
warn_unused_configs = true

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I"]
