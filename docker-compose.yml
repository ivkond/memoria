services:
  memoria:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: memoria
    ports:
      - "8080:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      MEMORIA_HOST: "0.0.0.0"
      MEMORIA_PORT: "8080"
      MEMORIA_MCP_PATH: "/mcp"
      MEMORIA_USER_HEADER_NAME: "x-user-id"
      MEMORIA_QDRANT_HOST: "qdrant"
      MEMORIA_QDRANT_PORT: "6333"
      MEMORIA_QDRANT_COLLECTION_NAME: "mem0"
      MEMORIA_MEM0_LLM_PROVIDER: "openai"
      MEMORIA_MEM0_LLM_BASE_URL: "https://api.aitunnel.ru/v1/"
      MEMORIA_MEM0_LLM_MODEL: "gpt-5.4-nano"
      MEMORIA_MEM0_LLM_API_KEY: "${MEMORIA_MEM0_LLM_API_KEY:?set MEMORIA_MEM0_LLM_API_KEY in .env or the shell environment}"
      MEMORIA_MEM0_EMBEDDER_PROVIDER: "openai"
      MEMORIA_MEM0_EMBEDDER_BASE_URL: "https://api.aitunnel.ru/v1/"
      MEMORIA_MEM0_EMBEDDER_MODEL: "qwen3-embedding-8b"
      MEMORIA_MEM0_EMBEDDER_API_KEY: "${MEMORIA_MEM0_EMBEDDER_API_KEY:?set MEMORIA_MEM0_EMBEDDER_API_KEY in .env or the shell environment}"
      MEMORIA_MEM0_API_KEY: "${MEMORIA_MEM0_API_KEY:-dummy}"
      MEMORIA_MEM0_HISTORY_DB_PATH: "/app/data/mem0_history.db"
      MEMORIA_MEM0_ENABLE_GRAPH: "false"
      MEMORIA_MEM0_GRAPH_PROVIDER: "memgraph"
      MEMORIA_MEM0_GRAPH_URL: "bolt://memgraph:7687"
      MEMORIA_MEM0_GRAPH_USERNAME: "memgraph"
      MEMORIA_MEM0_GRAPH_PASSWORD: "memgraph"
    volumes:
      - memoria-data:/app/data
    depends_on:
      qdrant:
        condition: service_started
      memgraph:
        condition: service_started

  qdrant:
    image: qdrant/qdrant:latest
    container_name: memoria-qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrant-data:/qdrant/storage

  memgraph:
    image: memgraph/memgraph:latest
    container_name: memoria-memgraph
    ports:
      - "7687:7687"
      - "7444:7444"
    volumes:
      - memgraph-data:/var/lib/memgraph

  memgraph-lab:
    image: memgraph/lab:latest
    container_name: memoria-memgraph-lab
    ports:
      - "3000:3000"
    depends_on:
      memgraph:
        condition: service_started

volumes:
  memoria-data:
  qdrant-data:
  memgraph-data:
