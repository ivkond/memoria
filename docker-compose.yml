services:
  memory-mcp-server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: memory-mcp-server
    ports:
      - "8080:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      MEMORY_MCP_HOST: "0.0.0.0"
      MEMORY_MCP_PORT: "8080"
      MEMORY_MCP_MCP_PATH: "/mcp"
      MEMORY_MCP_USER_HEADER_NAME: "x-user-id"
      MEMORY_MCP_QDRANT_HOST: "qdrant"
      MEMORY_MCP_QDRANT_PORT: "6333"
      MEMORY_MCP_QDRANT_COLLECTION_NAME: "mem0"
      MEMORY_MCP_MEM0_LLM_PROVIDER: "openai"
      MEMORY_MCP_MEM0_LLM_BASE_URL: "https://api.aitunnel.ru/v1/"
      MEMORY_MCP_MEM0_LLM_MODEL: "gpt-5.4-nano"
      MEMORY_MCP_MEM0_LLM_API_KEY: "REDACTED-ROTATED-KEY"
      MEMORY_MCP_MEM0_EMBEDDER_PROVIDER: "openai"
      MEMORY_MCP_MEM0_EMBEDDER_BASE_URL: "https://api.aitunnel.ru/v1/"
      MEMORY_MCP_MEM0_EMBEDDER_MODEL: "qwen3-embedding-8b"
      MEMORY_MCP_MEM0_EMBEDDER_API_KEY: "REDACTED-ROTATED-KEY"
      MEMORY_MCP_MEM0_API_KEY: "dummy"
      MEMORY_MCP_MEM0_HISTORY_DB_PATH: "/data/mem0_history.db"
      MEMORY_MCP_MEM0_ENABLE_GRAPH: "false"
      MEMORY_MCP_MEM0_GRAPH_PROVIDER: "memgraph"
      MEMORY_MCP_MEM0_GRAPH_URL: "bolt://memgraph:7687"
      MEMORY_MCP_MEM0_GRAPH_USERNAME: "memgraph"
      MEMORY_MCP_MEM0_GRAPH_PASSWORD: "memgraph"
    volumes:
      - memory-mcp-data:/data
    depends_on:
      qdrant:
        condition: service_started
      memgraph:
        condition: service_started

  qdrant:
    image: qdrant/qdrant:latest
    container_name: memory-qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrant-data:/qdrant/storage

  memgraph:
    image: memgraph/memgraph:latest
    container_name: memory-memgraph
    ports:
      - "7687:7687"
      - "7444:7444"
    volumes:
      - memgraph-data:/var/lib/memgraph

  memgraph-lab:
    image: memgraph/lab:latest
    container_name: memory-memgraph-lab
    ports:
      - "3000:3000"
    depends_on:
      memgraph:
        condition: service_started

volumes:
  memory-mcp-data:
  qdrant-data:
  memgraph-data:
