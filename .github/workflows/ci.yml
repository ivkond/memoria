name: CI

on:
  push:
    branches: ["master"]
    paths-ignore:
      - "**/*.md"
      - "LICENSE"
  pull_request:
    branches: ["master"]
    paths-ignore:
      - "**/*.md"
      - "LICENSE"
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    uses: ./.github/workflows/ci-quality.yml
    permissions:
      contents: read

  tests:
    uses: ./.github/workflows/ci-tests.yml
    permissions:
      contents: read

  e2e:
    uses: ./.github/workflows/ci-e2e.yml
    permissions:
      contents: read

  save-pr-meta:
    name: Save PR Metadata
    if: always() && github.event_name == 'pull_request'
    needs: [quality, tests, e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Write metadata
        shell: bash
        env:
          PR_NUMBER: ${{ github.event.number }}
          QUALITY: ${{ needs.quality.result }}
          TESTS: ${{ needs.tests.result }}
          E2E: ${{ needs.e2e.result }}
        run: |
          mkdir -p pr-meta
          echo "$PR_NUMBER" > pr-meta/pr_number
          echo "$QUALITY" > pr-meta/quality_result
          echo "$TESTS" > pr-meta/tests_result
          echo "$E2E" > pr-meta/e2e_result

      - name: Upload PR metadata
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pr-meta
          path: pr-meta/
          retention-days: 1

  ci-status:
    name: CI Gate
    if: always()
    needs: [quality, tests, e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check workflow results
        shell: bash
        env:
          QUALITY: ${{ needs.quality.result }}
          TESTS: ${{ needs.tests.result }}
          E2E: ${{ needs.e2e.result }}
        run: |
          echo "Quality: $QUALITY"
          echo "Tests: $TESTS"
          echo "E2E: $E2E"

          if [[ "$QUALITY" != "success" ]] || [[ "$TESTS" != "success" ]] || [[ "$E2E" != "success" ]]; then
            echo "::error::One or more CI jobs failed"
            exit 1
          fi
