name: E2E Tests

on:
  workflow_call:

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -e .[dev]

      - name: Run E2E tests
        env:
          RUN_E2E: "1"
        run: python -m pytest -q tests/e2e --junitxml=pytest-e2e.xml

      - name: Upload E2E reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-reports
          path: pytest-e2e.xml
          retention-days: 5
